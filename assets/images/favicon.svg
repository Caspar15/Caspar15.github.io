<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="c-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background squircle -->
  <rect width="64" height="64" rx="16" fill="url(#bg-grad)"/>
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1.5"/>

  <!-- Neural node connection lines -->
  <line x1="38" y1="20" x2="26" y2="32" stroke="rgba(56, 189, 248, 0.35)" stroke-width="2" stroke-dasharray="2 2"/>
  <line x1="26" y1="32" x2="38" y2="44" stroke="rgba(139, 92, 246, 0.35)" stroke-width="2" stroke-dasharray="2 2"/>

  <!-- Stylized Geometric "C" Arc -->
  <path d="M 42 19 A 18 18 0 1 0 42 45" fill="none" stroke="url(#c-grad)" stroke-width="5.5" stroke-linecap="round" filter="url(#glow)"/>

  <!-- AI Neural Nodes -->
  <circle cx="42" cy="19" r="3.5" fill="#38BDF8"/>
  <circle cx="21" cy="32" r="3.5" fill="#0284C7"/>
  <circle cx="42" cy="45" r="3.5" fill="#A855F7"/>
  <circle cx="34" cy="32" r="2.5" fill="#38BDF8" opacity="0.9"/>
</svg>
