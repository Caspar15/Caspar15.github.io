<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}陳柏宇 Caspar Chen 的個人作品集 — 台科大電機所碩士生、AI 演算法研究、IEEE ICACT 2026 Outstanding Paper Award。{% endif %}">
  <meta name="keywords" content="Caspar, 陳柏宇, 台科大, NTUST, GitHub, NLP, AI, 機器學習, 深度學習, 強化學習, 全端開發, IEEE">
  <meta name="author" content="陳柏宇 Caspar Chen">

  <!-- Open Graph -->
  <meta property="og:title" content="{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}">
  <meta property="og:description" content="陳柏宇 Caspar Chen 的個人作品集">
  <meta property="og:type" content="website">
  <meta property="og:image" content="/assets/images/profile.webp">

  <!-- Canonical -->
  <link rel="canonical" href="{{ page.url | prepend: site.url }}">

  <!-- Favicon placeholder -->
  <link rel="icon" type="image/png" href="/assets/images/profile.webp">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="/assets/css/main.css">
  <link rel="stylesheet" href="/assets/css/terminal.css">
  <link rel="stylesheet" href="/assets/css/page-transitions.css">
  <link rel="stylesheet" href="/assets/css/interactive-resume.css">
  <link rel="stylesheet" href="/assets/css/blog.css">

  {% if page.url == "/" %}
    <!-- External Libraries used by the home dashboard only -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" defer crossorigin="anonymous"></script>
  {% endif %}
</head>
<body class="page-{{ page.title | slugify }}">

  <!-- Reading Progress Bar -->
  <div id="progress-bar-container">
    <div id="progress-bar"></div>
  </div>

  <!-- Loading Overlay -->
  <div class="loading-overlay" aria-hidden="true">
    <div class="loading-spinner"></div>
  </div>

  <!-- Header / Navigation -->
  {% include header.html %}

  <main id="ajax-wrapper">
    <div id="pageContent">
      {% if page.title == "關於我" %}
        <div class="about-page-wrapper">
          {{ content }}
        </div>
      {% else %}
        {{ content }}
      {% endif %}
    </div>

    <div id="searchResults" aria-live="polite"></div>
  </main>

  <!-- Footer -->
  {% include footer.html %}

  <!-- Back to Top -->
  <a href="#" id="backToTopBtn" class="back-to-top" title="回到頂端" aria-label="回到頂端">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
      <path d="M12 4l-8 8h6v8h4v-8h6z"/>
    </svg>
  </a>

  <!-- JavaScript Modules -->
  <script type="module" src="/assets/js/main.js"></script>
  <script type="module" src="/assets/js/modules/animations.js"></script>
  <script type="module" src="/assets/js/modules/page-transitions.js"></script>
  {% if page.url == "/" %}
    <!-- 只有首頁有終端機與 GitHub 統計 -->
    <script type="module" src="/assets/js/modules/terminal.js"></script>
    <script type="module" src="/assets/js/modules/github.js"></script>
  {% endif %}
</body>
</html>
