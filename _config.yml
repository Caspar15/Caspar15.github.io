title: "陳柏宇 Caspar Chen"
description: "台科大電機所碩士生 · AI 演算法研究 · 全端工程師 · IEEE ICACT 2026 Outstanding Paper Award"
baseurl: ""                  # 因為是 user page (caspar15.github.io)，留空即可
url: "https://caspar15.github.io"

# 使用 kramdown 作為 Markdown 引擎
markdown: kramdown

# 外掛
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

collections:
  projects:
    output: true
    permalink: /projects/:name

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules
  - vendor
  - .gitignore
  - .idea
  - .vscode

# 設定永久連結 (專案頁面 URL 將會是 /projects/greenfriend/ 形式)
permalink: /:categories/:title/

# 摘要分隔符號
excerpt_separator: <!-- excerpt -->
