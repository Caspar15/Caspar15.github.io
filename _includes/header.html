<header class="site-header">
  <div class="wrapper">
    <button id="sidebarToggle" class="sidebar-toggle" aria-label="Toggle sidebar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </button>
    <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title | escape }}</a>
    <nav class="site-nav" aria-label="Main navigation">
      <button id="mobileMenuToggle" class="menu-icon" type="button" aria-label="開啟主選單" aria-expanded="false" aria-controls="primaryNavLinks">
        <svg viewBox="0 0 18 15" width="18" height="15">
          <path fill="currentColor" d="M18,1.484c0,0.82-0.665,1.484-1.484,1.484H1.484C0.665,2.969,0,2.304,0,1.484l0,0C0,0.665,0.665,0,1.484,0 h15.031C17.335,0,18,0.665,18,1.484L18,1.484z"/>
          <path fill="currentColor" d="M18,7.516C18,8.335,17.335,9,16.516,9H1.484C0.665,9,0,8.335,0,7.516l0,0c0-0.82,0.665-1.484,1.484-1.484 h15.031C17.335,6.031,18,6.696,18,7.516L18,7.516z"/>
          <path fill="currentColor" d="M18,13.516C18,14.335,17.335,15,16.516,15H1.484C0.665,15,0,14.335,0,13.516l0,0 c0-0.82,0.665-1.484,1.484-1.484h15.031C17.335,12.031,18,12.696,18,13.516L18,13.516z"/>
        </svg>
      </button>
      <div id="primaryNavLinks" class="trigger">
        <a class="page-link" href="{{ '/' | relative_url }}">首頁</a>
        <div class="nav-item dropdown">
          <a id="about-dropdown-toggle" class="page-link" href="javascript:void(0);">
            關於我
            <svg class="dropdown-arrow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="14" height="14"><path fill="currentColor" d="M7 10l5 5 5-5z"/></svg>
          </a>
          <div class="dropdown-content">
            <a class="page-link" href="{{ '/about/' | relative_url }}">個人總覽</a>
            <a class="page-link" href="{{ '/resume/' | relative_url }}">互動式履歷</a>
            <a class="page-link" href="{{ '/journey/' | relative_url }}">我的旅程</a>
          </div>
        </div>
        <a class="page-link" href="{{ '/blog/' | relative_url }}">部落格</a>
        <a class="page-link" href="{{ '/guestbook/' | relative_url }}">留言板</a>
        <input type="text" id="globalSearchInput" class="search-input" placeholder="搜尋..." aria-label="Search">
        <button id="darkModeToggle" class="dark-mode-toggle" aria-label="切換深色模式">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </div>
    </nav>
  </div>
</header>

</div>
